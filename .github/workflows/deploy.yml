name: Build & Deploy to Krystal

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/stanley-ferro run build

      - name: Compress images
        run: |
          sudo apt-get install -y imagemagick
          ASSETS="artifacts/stanley-ferro/dist/public/assets"
          for f in "$ASSETS"/*.jpg "$ASSETS"/*.jpeg "$ASSETS"/*.png; do
            [ -f "$f" ] || continue
            magick "$f" -resize "1920x1920>" -quality 75 -strip "$f"
          done

      - name: Write .htaccess
        run: |
          cat > artifacts/stanley-ferro/dist/public/.htaccess << 'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^ index.html [QSA,L]

          <FilesMatch "\.(html)$">
            Header set Cache-Control "no-store, no-cache, must-revalidate"
            Header set Pragma "no-cache"
          </FilesMatch>

          <FilesMatch "\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
          </FilesMatch>
          EOF

      - name: Deploy via FTP to Krystal
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -d -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" << 'LFTP'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose --parallel=3 artifacts/stanley-ferro/dist/public/ /
          quit
          LFTP
